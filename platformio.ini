; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; Common settings shared across environments
; =============================================================================
[common]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
board_upload.resetmethod = nodemcu
; upload_port = 192.168.0.130
; upload_protocol = espota
board_build.filesystem = littlefs
lib_extra_dirs =
	lib/ButtonManager
	lib/MQTTManager
	lib/ConfigManager

; =============================================================================
; Development build - includes debug output
; =============================================================================
; [env:esp01_1m]
; extends = common
; build_src_filter = +<*> -<minimal_ota.cpp>
; build_flags =
; 	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
; 	-DDEBUG_BUILD
; build_unflags =
; 	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
; lib_deps =
; 	knolleary/PubSubClient@^2.8
; 	https://github.com/tzapu/WiFiManager.git

; =============================================================================
; Release build - optimized for size, no debug output
; =============================================================================
[env:esp01_1m_release]
extends = common
build_src_filter = +<*> -<minimal_ota.cpp>
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-DRELEASE_BUILD
	-DNDEBUG
build_unflags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
lib_deps =
	knolleary/PubSubClient@^2.8
	https://github.com/tzapu/WiFiManager.git

; =============================================================================
; Minimal OTA build - for two-step OTA updates on space-constrained devices
